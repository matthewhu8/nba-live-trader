# Live trading configuration
# paper_mode: true is the default — set to false only for real money

trading:
  # paper_mode kept true on the shared branch so a checkout never trades real
  # money by default; flip to false locally for a live session. Live history:
  # 2026-06-03 went live for NYK@SAS Game 1 (user-authorized after Phase 0/1/3
  # ship — aggregator switch, doubled sizing) with the daily kill at $40.
  # 2026-06-10 went live for SAS@NYK (user-authorized; orphan-TP shutdown fix landed).
  paper_mode: false

inference:
  base_url: "http://localhost:8001"
  timeout_ms: 500
  # Model artifact paths (relative to repo root). Forwarded to the Python
  # inference service on /game/start; Python reloads ONLY if these differ from
  # the currently-loaded predictor. Swap models here without editing Python.
  model_path:  "models/saved/mmoe_delay20.pt"
  scaler_path: "models/saved/mmoe_scaler_delay20.pkl"

risk:
  # 2026-06-06: scaled-up sizing for the 0.12-threshold + maker-TP architecture.
  # Per-trade exposure can now reach 100C × 70¢ = $70 in the upper price band;
  # caps raised to fit. Daily kill at $40 ≈ 8 worst-case losses at the cap (taker SL
  # at 100C ≈ $5.18 loss including fee), which is intentionally tight given that
  # cap-sized trades only fire at |traj_used| ≥ ~0.62 (very rare high-conviction).
  max_total_exposure_cents: 7000       # $70 max open across all games
  max_per_game_exposure_cents: 7000    # $70 max open per game (single position can be 100C)
  max_daily_loss_cents: 4000           # $40 daily kill — unchanged from 2026-06-03 scale-up
  max_contracts_per_order: 100         # Kelly may size up to 100 contracts (was 80)

agent:
  min_yes_bid: 30
  max_yes_bid: 70
  # 2026-06-03 — Phase 1 winner: aggregator=mean, threshold=0.08, use_traj_for_side
  # via traj-driven side selection in agent.go. Sweep at 4×5×2 picked this combo
  # (+$39.3K net / 51.9% wr / 183 trades on 128 val games — beats all alternatives).
  # TP=5¢, SL=3¢ unchanged: break-even at TP=5/SL=3 is 37.5%; actual 51.9% margin.
  min_run_prob_entry: 0.0
  # 2026-06-06: raised from 0.08 → 0.12. At 0.08 the band 0.08-0.12 had 33% win
  # rate (below the 55-56% break-even at TP=5/SL=3 with maker entry + maker TP +
  # taker SL fees). Raising to 0.12 cuts ~60% of trades but lifts win rate to
  # ~60% (Phase 1 sweep: 0.12-0.20 band = 63%). Per-trade EV moves from negative
  # to ~+$0.11/30C in expectation.
  min_abs_traj_entry: 0.12
  min_run_length_entry: 2       # validated by mmoe_backtest_20260531_144752
  traj_aggregator: "mean"       # Phase 1 winner: mean of all 10 trajectory horizons
  take_profit_cents: 5
  stop_loss_cents: 3
  max_hold_possessions: 20      # avg hold ~47s in backtest; gate rarely binds
  position_size_contracts: 60   # fallback default — matches new Kelly floor
  # 2026-06-08: shallower slope + doubled floor. Floor 30→60 (2× sizing on
  # near-threshold entries that passed the 0.12 gate). Slope 200→100 halves
  # the gradient so most live entries size at 60-70; only extreme conviction
  # (|traj|>0.88) ramps toward the 100 cap. Worst-case taker SL at floor:
  # 60C × 50¢ × 3¢ ≈ $1.80 + ~$2 fee = ~$3.80, leaving ~10 SLs of daily-kill
  # headroom ($40 / $3.80). Per-game exposure at floor × 70¢ = $42 (under cap).
  kelly_anchor_traj: 0.12
  kelly_slope: 100
  kelly_min_contracts: 60
  market_drift_low_bid: 20
  market_drift_high_bid: 80
  # Exit execution: exits cross the book (taker) so stops actually fill. Accept
  # up to 2¢ through the best bid — bounds slippage vs the old post-only exits
  # that never filled (3¢ stop realized as -12¢ on 2026-05-28).
  exit_slippage_budget_cents: 2
  # Trailing take-profit. trail_giveback_cents: 0 keeps the validated flat
  # TP=5/SL=3. Set giveback > 0 (e.g. activate 5, giveback 3) to let winners
  # run — VALIDATE IN PAPER FIRST, this changes the backtested exit policy.
  trail_activate_cents: 5
  trail_giveback_cents: 0
  # Garbage-time / blowout GATE — when the system refuses to trade. Forwarded to
  # Python per-possession to drive the is_garbage_time / is_blowout flags.
  # IMPORTANT: these are the TRADE GATE, NOT the `garbage_time_risk` MODEL feature.
  # That feature is frozen at the training values (30/4/360) inside features.py and
  # is deliberately NOT tunable here — changing it would create train/serve skew.
  blowout_margin_pts: 30        # |score_diff| > this  → is_blowout
  garbage_time_period: 4        # garbage time only in this period (or later)
  garbage_time_clock_secs: 360  # ...and game_clock_secs < this

feeds:
  nba_poll_interval_ms: 3000
  kalshi_stale_threshold_ms: 30000

observability:
  redis_stream: "possession_events"
  log_level: "info"

# Feature column order — must match models/mmoe/feature_config.py ALL_FEATURE_COLS
feature_cols_checksum: "83_cols_v1"
