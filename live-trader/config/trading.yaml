# Live trading configuration
# paper_mode: true is the default — set to false only for real money

trading:
  paper_mode: false

inference:
  base_url: "http://localhost:8001"
  timeout_ms: 500

risk:
  # Worst case at 10 contracts × 70¢ = 700¢ per trade.
  max_total_exposure_cents: 1500      # $15 max open across all games
  max_per_game_exposure_cents: 700    # $7 max open per game
  max_daily_loss_cents: 2000          # $20 daily loss limit — halt all trading
  max_contracts_per_order: 10         # Kelly sizes up to 10 contracts

agent:
  min_yes_bid: 30
  max_yes_bid: 70
  # Fee-adjusted config: TP=10¢, SL=5¢ ensures positive EV at 47.8% win rate
  # after maker fees (0.0175 × C × P × (1-P), ceiling-rounded per order).
  # At 5 contracts: break-even win rate = 43.9% vs 47.8% actual.
  # traj≥0.15 replaces run_length gate (more selective, higher expected win rate).
  min_run_prob_entry: 0.0
  min_abs_traj_entry: 0.15      # Head B confidence gate (raised from 0.08)
  min_run_length_entry: 0       # disabled — traj gate is primary filter
  take_profit_cents: 10
  stop_loss_cents: 5
  max_hold_possessions: 20      # wider window to let TP=10¢ be reachable
  position_size_contracts: 5    # fallback default; Kelly varies by |traj_final|
  market_drift_low_bid: 20
  market_drift_high_bid: 80

feeds:
  nba_poll_interval_ms: 3000
  kalshi_stale_threshold_ms: 30000

observability:
  redis_stream: "possession_events"
  log_level: "info"

# Feature column order — must match models/mmoe/feature_config.py ALL_FEATURE_COLS
feature_cols_checksum: "83_cols_v1"
