# Live trading configuration
# paper_mode: true is the default — set to false only for real money

trading:
  paper_mode: true

inference:
  base_url: "http://localhost:8001"
  timeout_ms: 500

risk:
  # 10 contracts × 70¢ max = $7 per trade. Sized for one open position per game.
  max_total_exposure_cents: 1500      # $15 max open across all games (~2 positions)
  max_per_game_exposure_cents: 700    # $7 max open per game (1 position at 70¢)
  max_daily_loss_cents: 3000          # $30 daily loss limit — halt all trading
  max_contracts_per_order: 10

agent:
  min_yes_bid: 30
  max_yes_bid: 70
  # All entry gates below match the validated backtest config exactly:
  #   python -m backtesting.mmoe_backtest --use-traj-for-side --min-abs-traj 0.08 --min-run-length 2 --hold-seconds 240
  # Apr 7 → May 10 val set: 112 trades, 41.1% win rate, +$9,977 net (per 100 contracts).
  min_run_prob_entry: 0.0       # 2026-05-18: dropped to 0.0 per Matt's retrain backtest (110 val games on new entropy-regularized model). Tightening this threshold reduces P&L monotonically — Head A run_prob filter is worse than Head B trajectory filter at separating winners from losers. Backtest at 0.0: 207 trades, 47.8% win, +$37,409 vs 71 trades / +$9,865 at 0.15. Effective gating is now |traj_final|≥0.08, run_length≥2, 30–70¢ band.
  min_abs_traj_entry: 0.08      # Head B confidence
  min_run_length_entry: 2       # momentum filter
  take_profit_cents: 5       # 2026-05-13: aligned to backtest (was 8). Backtest used 5¢ TP across 112 trades, 40 of which hit TP at exactly 5-7¢.
  stop_loss_cents: 3         # 2026-05-13: aligned to backtest (was 5). Backtest SL was -3¢.
  max_hold_possessions: 6
  position_size_contracts: 10
  # 2026-05-19 pin-the-market: scanner locks on to the initial closest-to-50¢
  # market and only swaps when the LOCKED market drifts outside this band.
  # Wider than [min_yes_bid, max_yes_bid] on purpose — we'd rather sit idle on
  # the same logical bet than swap to a sibling contract (which inverts the
  # meaning of traj_final and corrupts the model's assumptions).
  market_drift_low_bid: 20
  market_drift_high_bid: 80

feeds:
  nba_poll_interval_ms: 3000
  kalshi_stale_threshold_ms: 30000   # emit stale sentinel after 30s silence

observability:
  redis_stream: "possession_events"
  log_level: "info"

# Feature column order — must match models/mmoe/feature_config.py ALL_FEATURE_COLS
# Go reads this to align the 83-float vector sent to/from Python
feature_cols_checksum: "83_cols_v1"  # bump when feature_config.py changes
