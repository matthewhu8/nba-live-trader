# Live trading configuration
# paper_mode: true is the default — set to false only for real money

trading:
  paper_mode: true

inference:
  base_url: "http://localhost:8001"
  timeout_ms: 500

risk:
  # Sized for max 5 contracts. Worst case: 5 × 70¢ = 350¢ exposure per trade.
  max_total_exposure_cents: 1000      # $10 max open across all games
  max_per_game_exposure_cents: 500    # $5 max open per game
  max_daily_loss_cents: 2000          # $20 daily loss limit — halt all trading
  max_contracts_per_order: 15          # Kelly sizes 1–5; this is the hard cap

agent:
  min_yes_bid: 30
  max_yes_bid: 70
  # Entry gates match the validated backtest config exactly:
  #   python -m backtesting.mmoe_backtest --use-traj-for-side --min-abs-traj 0.08
  #     --min-run-length 2 --hold-seconds 240
  #   207 trades, 47.8% win rate, +$37,409 net (110 val games)
  min_run_prob_entry: 0.0
  min_abs_traj_entry: 0.08      # Head B confidence gate
  min_run_length_entry: 2       # momentum filter
  take_profit_cents: 5
  stop_loss_cents: 3
  max_hold_possessions: 14      # ~240s at 17s/possession — matches backtest hold_seconds=240
  position_size_contracts: 5    # fallback default; Kelly will vary 1–5 based on |traj_final|
  market_drift_low_bid: 20
  market_drift_high_bid: 80

feeds:
  nba_poll_interval_ms: 3000
  kalshi_stale_threshold_ms: 30000

observability:
  redis_stream: "possession_events"
  log_level: "info"

# Feature column order — must match models/mmoe/feature_config.py ALL_FEATURE_COLS
feature_cols_checksum: "83_cols_v1"
