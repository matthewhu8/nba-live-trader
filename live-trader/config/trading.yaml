# Live trading configuration
# paper_mode: true is the default — set to false only for real money

trading:
  paper_mode: true

inference:
  base_url: "http://localhost:8001"
  timeout_ms: 500

risk:
  max_total_exposure_cents: 5000      # $50 max open across all games
  max_per_game_exposure_cents: 2000   # $20 max open per game
  max_daily_loss_cents: 10000         # $100 daily loss limit — halt all trading
  max_contracts_per_order: 100

agent:
  min_yes_bid: 30
  max_yes_bid: 70
  # All entry gates below match the validated backtest config exactly:
  #   python -m backtesting.mmoe_backtest --use-traj-for-side --min-abs-traj 0.08 --min-run-length 2 --hold-seconds 240
  # Apr 7 → May 10 val set: 112 trades, 41.1% win rate, +$9,977 net (per 100 contracts).
  min_run_prob_entry: 0.15      # Restored 2026-05-13. Head A's apparent gate collapse was caused by sub_count feature drift (+73σ outlier from cumulative counter bug). With sub_count fixed in game_state.py, Head A should produce backtest-distribution run_prob values again.
  min_abs_traj_entry: 0.08      # Head B confidence
  min_run_length_entry: 2       # momentum filter
  take_profit_cents: 5       # 2026-05-13: aligned to backtest (was 8). Backtest used 5¢ TP across 112 trades, 40 of which hit TP at exactly 5-7¢.
  stop_loss_cents: 3         # 2026-05-13: aligned to backtest (was 5). Backtest SL was -3¢.
  max_hold_possessions: 6
  position_size_contracts: 100

feeds:
  nba_poll_interval_ms: 3000
  kalshi_stale_threshold_ms: 30000   # emit stale sentinel after 30s silence

observability:
  redis_stream: "possession_events"
  log_level: "info"

# Feature column order — must match models/mmoe/feature_config.py ALL_FEATURE_COLS
# Go reads this to align the 83-float vector sent to/from Python
feature_cols_checksum: "83_cols_v1"  # bump when feature_config.py changes
